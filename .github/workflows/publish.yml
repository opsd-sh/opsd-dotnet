name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet run --project tests/Opsd.Tests
          --configuration Release
          --no-build

      - name: Verify tag matches package version
        run: |
          version="$(dotnet msbuild src/Opsd/Opsd.csproj \
            -getProperty:Version -nologo)"
          test "$GITHUB_REF_NAME" = "v${version}"

      - name: Pack release
        run: >-
          dotnet pack src/Opsd/Opsd.csproj
          --configuration Release
          --no-build
          --output artifacts

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-package
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: package
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      id-token: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-package
          path: artifacts/

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Get a temporary NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >-
          dotnet nuget push artifacts/Opsd.*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
